[project]
name = "fh6-hub"
version = "0.1.0"
description = "Windows tray hub that relays Forza Horizon UDP telemetry to the mobile dashboard over WebSocket, with QR pairing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=12.3.0",
    "pystray>=0.19.5",
    "qrcode>=8.2",
    "websockets>=16.1",
    "zeroconf>=0.150.0",
]
